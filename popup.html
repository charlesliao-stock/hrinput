<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KMUH 班表輸入小幫手</title>
    <style>
        html { min-width: 320px; max-width: 100vw; overflow-x: hidden; }
        body {
            width: min(780px, calc(100vw - 20px));
            min-width: 320px;
            max-width: 100vw;
            margin: 0 auto;
            padding: clamp(8px, 2vw, 15px);
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f8f9fa;
            overflow-x: hidden;
        }
        .container { display: flex; flex-direction: column; gap: 10px; }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 8px; cursor: pointer; }
        .step-box { background: white; padding: 10px; border-radius: 6px; border: 1px solid #dee2e6; }
        .step-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #34495e; }
        button { width: 100%; padding: 10px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; background-color: #3498db; color: white; }
        button:hover { background-color: #2980b9; }
        #status { margin-top: 10px; padding: 8px; font-size: 13px; border-radius: 4px; background-color: #e9ecef; color: #495057; text-align: center; min-height: 20px; }
        #sheetSelectBox { display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 10px; border-radius: 6px; margin-top: 5px; }
        #sheetSelectBox select { width: 100%; padding: 5px; margin-top: 5px; }
        .settings-section { margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
        .sub-btn { background: #ecf0f1; color: #2c3e50; padding: 5px 10px; font-size: 12px; border: 1px solid #bdc3c7; text-align: left; cursor: pointer; border-radius: 3px; display: inline-block; }
        #excelFile { display: none; }
        .source-divider { margin: 8px 0 6px; text-align: center; color: #7f8c8d; font-size: 12px; }
        .google-sheets-row { display: flex; gap: 6px; align-items: stretch; }
        #googleSheetsUrl { flex: 1; min-width: 0; box-sizing: border-box; padding: 9px 8px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 12px; }
        #googleSheetsReadBtn { width: 88px; padding: 8px 6px; background: #4285f4; font-size: 12px; white-space: nowrap; }
        #googleSheetsReadBtn:hover { background: #3367d6; }
        .google-sheets-hint { margin-top: 5px; color: #6c757d; font-size: 11px; line-height: 1.45; }
        #step3Box, #step4Box { display: none; }
        
        /* 更新提醒樣式 */
        #updateAlert { 
            display: none; 
            background: #e74c3c; 
            color: white; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            font-size: 12px; 
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }
        #updateAlert b { display: block; margin-bottom: 6px; font-size: 15px; text-align: center; }
        #updateAlert .guide { 
            background: rgba(255,255,255,0.15); 
            padding: 8px; 
            border-radius: 4px; 
            margin: 8px 0; 
            line-height: 1.5;
            text-align: left;
        }
        #updateAlert button { 
            background: white; 
            color: #e74c3c; 
            padding: 8px; 
            font-size: 13px; 
            font-weight: bold;
            border-radius: 4px;
            border: none;
            transition: transform 0.1s;
        }
        #updateAlert button:active { transform: scale(0.98); }

        /* 匯入前確認視窗：讓小螢幕也能保留完整操作區，不因固定高度被裁切 */
        @media (max-width: 420px) {
            body { min-width: 0; width: 100%; padding: 8px; }
            .step-box { padding: 8px; }
            button { padding: 9px 8px; }
        }
        .import-complete {
            min-width: 240px;
            width: auto;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .import-complete-note {
            padding: 12px 16px;
            border: 1px solid #bcd9f7;
            border-radius: 6px;
            background: #f1f8ff;
            color: #2c3e50;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        /* 只有國定假日需要逐日點選時，確認視窗才放大為原 popup 約兩倍。 */
        html.popup-nh-expanded {
            width: 800px;
            min-width: 640px;
            max-width: 800px;
            height: var(--popup-nh-height, 600px);
            min-height: var(--popup-nh-height, 600px);
            max-height: var(--popup-nh-height, 600px);
            overflow: hidden;
        }
        html.popup-nh-expanded body {
            width: 800px;
            min-width: 640px;
            max-width: 800px;
            height: var(--popup-nh-height, 600px);
            min-height: var(--popup-nh-height, 600px);
            max-height: var(--popup-nh-height, 600px);
            overflow: hidden;
        }

        /* 匯入前確認但沒有國定假日：固定成可閱讀的寬敞小視窗，
           避免原始 popup viewport 過窄導致訊息被擠成直欄。 */
        html.popup-preimport-compact {
            width: 520px;
            min-width: 520px;
            max-width: 520px;
            height: 500px;
            min-height: 500px;
            max-height: 500px;
            overflow: hidden;
        }
        html.popup-preimport-compact body {
            width: 520px;
            min-width: 520px;
            max-width: 520px;
            height: 500px;
            min-height: 500px;
            max-height: 500px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="updateAlert">
        <b>🚀 發現新版本！</b>
        <div id="updateVersion" style="text-align:center; margin-bottom:8px;"></div>
        <div class="guide">
            <b>💡 更新三步驟：</b>
            1. 點擊下方按鈕下載 ZIP<br>
            2. 解壓縮並覆蓋舊資料夾<br>
            3. 到擴充功能頁面點擊「重新載入」
        </div>
        <button id="downloadUpdateBtn">📥 立即下載更新檔 (ZIP)</button>
    </div>

    <h2>💉 KMUH 班表輸入小幫手</h2>
    <div class="container">
        <div class="step-box">
            <div class="step-title">1️⃣ 讀取本月班表</div>
            <button id="step1Btn">💾 記憶本月班表並跳轉至次月</button>
        </div>
        <div class="step-box">
            <div class="step-title">2️⃣ 載入次月班表</div>
            <button id="step2Btn">📂 選擇 Excel 檔案</button>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
            <div class="source-divider">或</div>
            <label for="googleSheetsUrl" style="display:block; font-size:12px; color:#34495e; margin-bottom:4px;">Google Sheets 網址</label>
            <div class="google-sheets-row">
                <input id="googleSheetsUrl" type="url" placeholder="貼上 Google Sheets 網址">
                <button id="googleSheetsReadBtn" type="button">📥 讀取</button>
            </div>
            <div class="google-sheets-hint">請確認試算表已設定為「知道連結的任何人可檢視」。讀取後若有多個工作表，可在下方選擇。</div>
        </div>
        <div id="sheetSelectBox">
            <div style="font-size:12px; color:#856404; margin-bottom:4px;">📋 偵測到多個工作表，請選擇：</div>
            <select id="sheetSelect"></select>
            <button id="sheetConfirmBtn" style="margin-top:6px; background:#27ae60;">✅ 確認匯入此工作表</button>
        </div>
        <div id="step3Box" class="step-box"><div class="step-title">3️⃣ 檢測區</div><button id="step3Btn" style="background-color: #f39c12;">🔍 檢測報告</button></div>
        <div id="step4Box" class="step-box"><div class="step-title">4️⃣ 寫入區</div><button id="step4Btn" style="background-color: #27ae60;">🚀 開始寫入</button></div>
        <div id="status">準備就緒</div>
        <div class="settings-section">
            <div class="sub-btn" id="openQuickSettings">⚙️ 選項設定</div>
            <div class="sub-btn" id="openDictManager">📖 班別字典管理</div>
        </div>
    </div>
    <script src="xlsx.full.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
